app = "discord-deal-bot" # Replace this with your actual app name from 'fly apps list'
primary_region = "iad"

[build]

[[mounts]]
source = "bot_data"
destination = "/data"

[env]
# Tell the bot where to find the database on the persistent volume
DATABASE_PATH = "/data/wishlist.db"
PYTHONUNBUFFERED = "1"